<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>조석 현상 시뮬레이션 - 얌샘</title>
    <style>
        @font-face {
            font-family: 'NexonMaplestory';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }
        body { margin: 0; overflow: hidden; background: #000b1a; font-family: 'NexonMaplestory', sans-serif; color: white; }
        
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.7); padding: 20px; 
            z-index: 10; backdrop-filter: blur(5px);
        }

        .control-group { margin-top: 15px; display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
        input[type=range] { cursor: pointer; accent-color: #f1c40f; width: 120px; }

        button {
            margin-top: 15px; padding: 10px 15px; background: #f1c40f; border: none; border-radius: 8px;
            font-family: 'NexonMaplestory'; cursor: pointer; transition: 0.2s; font-weight: bold; color: #000b1a;
        }
        button:hover { background: #f39c12; transform: scale(1.05); }

        footer {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-size: 0.8rem; color: rgba(255,255,255,0.4); z-index: 5;
        }
        footer a { color: inherit; text-decoration: none; }
        footer a:hover { color: #f1c40f; }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h2 style="margin:0 0 10px 0; color:#f1c40f;">조석 현상 입체 분석</h2>
    <p style="margin:0; font-size: 0.9rem;">달을 이동시켜 <span style="color:#f1c40f;">갯벌 영역</span>을 실시간으로 찾아보세요.</p>
    
    <div class="control-group">
        <span>해안 경사:</span>
        <input type="range" id="slopeSlider" min="0.3" max="0.85" step="0.01" value="0.65">
    </div>

    <button onclick="startAutoScan()">달 움직이기</button>
    <button onclick="resetDiscovery()" style="background:#95a5a6; margin-left:5px;">기록 초기화</button>
</div>

<footer>
    <a href="https://indischool.com/@nameplz" target="_blank">ⓒ얌샘, 2026, all rights reserved.</a>
</footer>

<canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const slopeSlider = document.getElementById('slopeSlider');

    let width, height;
    let moon = { x: 0, y: 270, r: 40, isDragging: false };
    let currentSlopeX = parseFloat(slopeSlider.value);
    
    // [핵심] 실시간 갯벌 기록 변수
    let discoveredLowX = 9999;  // 가장 물이 많이 빠졌던 곳 (간조선)
    let discoveredHighX = 0;    // 가장 물이 많이 찼던 곳 (만조선)
    let waterLineX = 0;
    let isAutoScanning = false;

    const fishes = [];
    const seaweed = [];

    function initAssets() {
        fishes.length = 0; seaweed.length = 0;
        for(let i=0; i<8; i++) {
            fishes.push({
                x: Math.random() * width * 0.3,
                y: height * 0.8 + Math.random() * 50,
                speed: 1.5 + Math.random() * 1.5,
                dir: Math.random() > 0.5 ? 1 : -1,
                size: 15 + Math.random() * 10
            });
        }
        for(let i=0; i<15; i++) {
            seaweed.push({ x: 30 + Math.random() * width * 0.7, h: 40 + Math.random() * 40, offset: Math.random() * 100 });
        }
    }

    function resetDiscovery() {
        discoveredLowX = 9999; discoveredHighX = 0;
    }

    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        if (moon.x === 0) moon.x = width * 0.4;
        initAssets();
    }

    window.addEventListener('resize', resize);
    resize();

    slopeSlider.addEventListener('input', (e) => {
        currentSlopeX = parseFloat(e.target.value);
        resetDiscovery();
    });

    canvas.addEventListener('mousedown', (e) => {
        if (Math.hypot(e.clientX - moon.x, e.clientY - moon.y) < moon.r) moon.isDragging = true;
    });
    window.addEventListener('mousemove', (e) => {
        if (moon.isDragging) moon.x = Math.max(50, Math.min(width - 50, e.clientX));
    });
    window.addEventListener('mouseup', () => moon.isDragging = false);

    function startAutoScan() {
        isAutoScanning = true; moon.x = 50; resetDiscovery();
    }

    // 지형 경계 계산 함수 (물고기 충돌용)
    function getSlopeLimitX(y) {
        if (y > height - 20) return width * currentSlopeX;
        if (y < height - 320) return width;
        const ratio = (height - 20 - y) / 300;
        return width * currentSlopeX + ratio * (width * (1 - currentSlopeX));
    }

    function drawFish(f, time) {
        const yPos = f.y + Math.sin(time + f.x * 0.05) * 5;
        const slopeLimit = getSlopeLimitX(yPos);
        // 물고기는 현재 수위(waterLineX)와 실제 지형 경사면 중 더 왼쪽인 곳까지만 이동 가능
        const limitX = Math.min(waterLineX, slopeLimit) - 15;

        f.x += f.speed * f.dir;
        if (f.x > limitX || f.x < 20) {
            f.dir *= -1;
            f.x = f.x > limitX ? limitX : 20;
        }

        ctx.save();
        ctx.translate(f.x, yPos);
        if (f.dir === -1) ctx.scale(-1, 1);
        ctx.fillStyle = f.x < waterLineX ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.05)";
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size, f.size/2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-f.size + 2, 0); ctx.lineTo(-f.size - 8, -8); ctx.lineTo(-f.size - 8, 8);
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    function drawSeaweed(s, time) {
        const isSubmerged = s.x < waterLineX;
        const sway = isSubmerged ? Math.sin(time + s.offset) * 10 : 0;
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = isSubmerged ? "rgba(46, 204, 113, 0.5)" : "rgba(39, 174, 96, 0.15)";
        ctx.moveTo(s.x, height - 15);
        ctx.bezierCurveTo(s.x + sway, height - 15 - s.h/2, s.x - sway, height - 15 - s.h, s.x, height - 15 - s.h);
        ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        const time = Date.now() * 0.002;

        if (isAutoScanning) {
            moon.x += 6;
            if (moon.x >= width - 50) isAutoScanning = false;
        }

        // 1. 단면도 지형
        ctx.beginPath();
        ctx.moveTo(0, height); ctx.lineTo(width, height);
        ctx.lineTo(width, height - 320);
        ctx.lineTo(width * currentSlopeX, height - 20);
        ctx.lineTo(0, height - 20);
        ctx.fillStyle = '#C2B280';
        ctx.fill();

        // 2. 수면 계산
        ctx.beginPath();
        ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
        ctx.moveTo(0, height);
        waterLineX = width;

        for (let i = 0; i <= 100; i++) {
            const x = (width / 100) * i;
            const dist = Math.abs(x - moon.x);
            const pull = 75 * Math.exp(-Math.pow(dist / (width * 0.35), 2));
            const y = height * 0.78 - pull;
            ctx.lineTo(x, y);

            const slopeY = x < width * currentSlopeX ? height - 20 : (height - 20) - ((x - width * currentSlopeX) / (width * (1 - currentSlopeX))) * 300;
            if (y > slopeY && x > width * currentSlopeX && waterLineX === width) {
                waterLineX = x;
            }
        }
        ctx.lineTo(width, height);
        ctx.fill();

        // [핵심] 실시간 갯벌 기록 갱신
        if (waterLineX < discoveredLowX) discoveredLowX = waterLineX;
        if (waterLineX > discoveredHighX) discoveredHighX = waterLineX;

        seaweed.forEach(s => drawSeaweed(s, time));
        fishes.forEach(f => drawFish(f, time));

        // 3. 평면도 (실시간 탐색 결과 반영)
        const mapW = 280, mapH = 160, mapX = width - mapW - 40, mapY = 40;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(mapX - 5, mapY - 5, mapW + 10, mapH + 10);
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(mapX - 5, mapY - 5, mapW + 10, mapH + 10);

        // 기본 육지 (모래사장)
        ctx.fillStyle = '#C2B280';
        ctx.fillRect(mapX, mapY, mapW, mapH);

        // 발견된 갯벌 영역 (실시간 짙은 갈색)
        if (discoveredHighX > discoveredLowX) {
            const mudStart = (discoveredLowX / width) * mapW;
            const mudEnd = (discoveredHighX / width) * mapW;
            ctx.fillStyle = '#5D4037'; 
            ctx.fillRect(mapX + mudStart, mapY, mudEnd - mudStart, mapH);
        }

        // 현재 바다 영역
        const seaDisplayW = ((waterLineX / width) * mapW);
        ctx.fillStyle = '#00a8ff';
        ctx.fillRect(mapX, mapY, seaDisplayW, mapH);

        ctx.fillStyle = 'white'; ctx.font = '12px NexonMaplestory';
        ctx.fillText('위에서 본 모양', mapX, mapY - 12);

        // 4. 달 그리기
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f1c40f';
        ctx.shadowBlur = 15; ctx.shadowColor = '#f1c40f';
        ctx.fill(); ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
