<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조석 현상 시뮬레이션 - 얌샘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'NexonMaplestory';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }
        body { margin: 0; overflow: hidden; background: #000b1a; font-family: 'NexonMaplestory', sans-serif; color: white; }
        
/* 기본 UI 스타일 수정 */
#ui { 
    position: absolute; top: 15px; left: 15px; 
    background: rgba(0,0,0,0.75); padding: 15px; 
    z-index: 20; backdrop-filter: blur(8px);
    border-radius: 15px; border: 1px solid rgba(241, 196, 15, 0.3);
    width: 280px; transition: all 0.3s ease;
    cursor: pointer; /* 클릭 가능하다는 표시 */
    overflow: hidden;
}

/* 모바일 전용 스타일 (너비 600px 이하) */
@media (max-width: 600px) {
    #ui.collapsed {
        width: 160px; /* 제목만 보일 정도의 너비 */
        height: 25px; /* 제목 한 줄 높이 */
        padding: 10px 15px;
    }
    #ui.collapsed .control-group, 
    #ui.collapsed .btn-group,
    #ui.collapsed p {
        display: none; /* 접혔을 때 내용 숨김 */
    }
}
        h2 { margin: 0 0 10px 0; color: #f1c40f; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        p { margin: 0; font-size: 0.8rem; line-height: 1.5; color: #ecf0f1; }

        .control-group { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        input[type=range] { cursor: pointer; accent-color: #f1c40f; width: 100%; height: 6px; }

        .btn-group { display: flex; gap: 8px; margin-top: 15px; }

        button {
            flex: 1; padding: 10px; background: #f1c40f; border: none; border-radius: 8px;
            font-family: 'NexonMaplestory'; cursor: pointer; transition: 0.3s; 
            font-weight: bold; color: #000b1a; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        button:hover { background: #f39c12; transform: translateY(-2px); }
        .btn-blue { background: #3498db; color: white; }

        footer {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-size: 0.7rem; color: rgba(255,255,255,0.2); z-index: 5;
        }
        canvas { display: block; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>

<div id="ui">
    <h2><i class="fa-solid fa-chart-line"></i> 조석 입체 분석</h2>
    <p>우측 상단의 <span style="color:#f1c40f;">평면 분석창</span>을 클릭하여 상세한 갯벌 지도를 확인하세요.</p>
    
    <div class="control-group">
        <span style="font-size: 0.75rem;"><i class="fa-solid fa-water"></i> 해안 경사 (완만하게)</span>
        <input type="range" id="slopeSlider" min="0.1" max="0.85" step="0.01" value="0.65">
    </div>

    <div class="btn-group">
        <button class="btn-blue" onclick="moveTide('low')"><i class="fa-solid fa-arrow-left"></i> 썰물</button>
        <button onclick="moveTide('high')">밀물 <i class="fa-solid fa-arrow-right"></i></button>
    </div>
</div>

<footer>ⓒ얌샘, 2026, all rights reserved.</footer>

<canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const slopeSlider = document.getElementById('slopeSlider');

    let width, height;
    let moon = { x: 0, y: 0, r: 40, targetX: 0, isDragging: false };
    let currentSlopeX = parseFloat(slopeSlider.value);
    
    // 미니맵 모핑 관련 변수
    let mapInfo = {
        isExpanded: false,
        x: 0, y: 0, w: 0, h: 0,
        targetW: 0, targetH: 0, targetX: 0, targetY: 0
    };

    let discoveredLowX = 9999, discoveredHighX = 0, waterLineX = 0;
    const fishes = [], seaweed = [];

    function initAssets() {
        fishes.length = 0; seaweed.length = 0;
        for(let i=0; i<8; i++) {
            fishes.push({
                x: Math.random() * width * 0.3,
                y: height * 0.8 + Math.random() * 50,
                speed: 1.0 + Math.random() * 1.2,
                dir: Math.random() > 0.5 ? 1 : -1,
                size: 14 + Math.random() * 8
            });
        }
        for(let i=0; i<20; i++) {
            seaweed.push({ 
                x: 40 + Math.random() * width * 0.75, 
                h: 30 + Math.random() * 40, 
                offset: Math.random() * 100,
                color: Math.random() > 0.5 ? "#2ecc71" : "#27ae60"
            });
        }
    }

    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        if (moon.x === 0) { moon.x = width * 0.3; moon.targetX = moon.x; }
        moon.y = height * 0.25;
        updateMapTarget();
        // 초기 상태 강제 설정
        mapInfo.x = mapInfo.targetX; mapInfo.y = mapInfo.targetY;
        mapInfo.w = mapInfo.targetW; mapInfo.h = mapInfo.targetH;
        initAssets();
    }

    function updateMapTarget() {
        if (mapInfo.isExpanded) {
            mapInfo.targetW = Math.min(width * 0.85, 800);
            mapInfo.targetH = mapInfo.targetW * 0.55;
            mapInfo.targetX = (width - mapInfo.targetW) / 2;
            mapInfo.targetY = (height - mapInfo.targetH) / 2;
            ui.style.opacity = "0.2";
        } else {
            // 기존 크기 대비 50% 축소 적용
            mapInfo.targetW = width < 600 ? 100 : 130; 
            mapInfo.targetH = mapInfo.targetW * 0.55;
            mapInfo.targetX = width - mapInfo.targetW - 20;
            mapInfo.targetY = 20;
            ui.style.opacity = "1";
        }
    }

    window.addEventListener('resize', resize);
    resize();

    slopeSlider.addEventListener('input', (e) => {
        currentSlopeX = parseFloat(e.target.value);
        discoveredLowX = 9999; discoveredHighX = 0;
    });

    const getPos = (e) => {
        if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    };

    canvas.addEventListener('mousedown', (e) => {
        const pos = getPos(e);
        // 미니맵 클릭 판정
        if (pos.x > mapInfo.x && pos.x < mapInfo.x + mapInfo.w && pos.y > mapInfo.y && pos.y < mapInfo.y + mapInfo.h) {
            mapInfo.isExpanded = !mapInfo.isExpanded;
            updateMapTarget();
            return;
        }
        if (Math.hypot(pos.x - moon.x, pos.y - moon.y) < moon.r * 1.5) moon.isDragging = true;
    });

    window.addEventListener('mousemove', (e) => {
        if (moon.isDragging) moon.targetX = Math.max(50, Math.min(width - 50, getPos(e).x));
    });

    window.addEventListener('mouseup', () => moon.isDragging = false);

    canvas.addEventListener('touchstart', (e) => {
        const pos = getPos(e);
        if (pos.x > mapInfo.x && pos.x < mapInfo.x + mapInfo.w && pos.y > mapInfo.y && pos.y < mapInfo.y + mapInfo.h) {
            mapInfo.isExpanded = !mapInfo.isExpanded;
            updateMapTarget();
            e.preventDefault();
            return;
        }
        if (Math.hypot(pos.x - moon.x, pos.y - moon.y) < moon.r * 2) {
            moon.isDragging = true;
            e.preventDefault();
        }
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
        if (moon.isDragging) {
            moon.targetX = Math.max(50, Math.min(width - 50, getPos(e).x));
            e.preventDefault();
        }
    }, {passive: false});

    window.addEventListener('touchend', () => moon.isDragging = false);

    function moveTide(type) {
        const step = width * 0.2; 
        if (type === 'high') moon.targetX = Math.min(width - 60, moon.targetX + step);
        else moon.targetX = Math.max(60, moon.targetX - step);
    }

    function drawFish(f, time) {
        const yPos = f.y + Math.sin(time + f.x * 0.05) * 5;
        const slopeY = f.x < width * currentSlopeX ? height - 20 : (height - 20) - ((f.x - width * currentSlopeX) / (width * (1 - currentSlopeX))) * 300;
        const isVisible = f.x < waterLineX && yPos < slopeY;
        
        f.x += f.speed * f.dir;
        const limitX = waterLineX - 20;
        if (f.x > limitX || f.x < 20) { f.dir *= -1; f.x = f.x > limitX ? limitX : 20; }

        ctx.save();
        ctx.translate(f.x, yPos);
        if (f.dir === -1) ctx.scale(-1, 1);
        
        // [수정] 모든 물고기 색상 통일 (회색 제거)
        ctx.fillStyle = isVisible ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.1)";
        
        ctx.beginPath();
        ctx.ellipse(0, 0, f.size, f.size/2.2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(-f.size + 2, 0);
        ctx.lineTo(-f.size - 8, -f.size/2.5);
        ctx.lineTo(-f.size - 8, f.size/2.5);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
    }

    function drawSeaweed(s, time) {
        const isSubmerged = s.x < waterLineX;
        const sway = isSubmerged ? Math.sin(time + s.offset) * 12 : 0;
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = isSubmerged ? s.color : "rgba(39, 174, 96, 0.2)";
        ctx.moveTo(s.x, height - 15);
        ctx.bezierCurveTo(s.x + sway, height - 15 - s.h/3, s.x - sway, height - 15 - (s.h*2)/3, s.x + sway/2, height - 15 - s.h);
        ctx.stroke();
    }

function draw() {
        ctx.clearRect(0, 0, width, height);
        const time = Date.now() * 0.002;

        moon.x += (moon.targetX - moon.x) * 0.08;
        
        // 미니맵 모핑 애니메이션
        mapInfo.x += (mapInfo.targetX - mapInfo.x) * 0.1;
        mapInfo.y += (mapInfo.targetY - mapInfo.y) * 0.1;
        mapInfo.w += (mapInfo.targetW - mapInfo.w) * 0.1;
        mapInfo.h += (mapInfo.targetH - mapInfo.h) * 0.1;

        // [순서 변경 1] 달을 지형보다 먼저(또는 미니맵보다 먼저) 그립니다.
        // 상세 분석 모드일 때는 달을 더 흐리게 표현하여 뒤에 있는 느낌을 줍니다.
        ctx.save();
        ctx.globalAlpha = mapInfo.isExpanded ? 0.3 : 1.0; // 분석 모드 시 투명도 조절
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f1c40f';
        ctx.shadowBlur = 20; ctx.shadowColor = '#f1c40f';
        ctx.fill(); 
        ctx.shadowBlur = 0;
        ctx.restore();

        // 1. 지형
        ctx.beginPath();
        ctx.moveTo(0, height); ctx.lineTo(width, height);
        ctx.lineTo(width, height - 320);
        ctx.lineTo(width * currentSlopeX, height - 20);
        ctx.lineTo(0, height - 20);
        ctx.fillStyle = '#C2B280';
        ctx.fill();

        // 2. 수면
        ctx.beginPath();
        ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
        ctx.moveTo(0, height);
        waterLineX = width;
        for (let i = 0; i <= 100; i++) {
            const x = (width / 100) * i;
            const pull = 85 * Math.exp(-Math.pow((x - moon.x) / (width * 0.35), 2));
            const y = height * 0.78 - pull;
            ctx.lineTo(x, y);
            const slopeAtY = x < width * currentSlopeX ? height - 20 : (height - 20) - ((x - width * currentSlopeX) / (width * (1 - currentSlopeX))) * 300;
            if (y > slopeAtY && x > width * currentSlopeX && waterLineX === width) waterLineX = x;
        }
        ctx.lineTo(width, height); ctx.fill();

        if (waterLineX < discoveredLowX) discoveredLowX = waterLineX;
        if (waterLineX > discoveredHighX) discoveredHighX = waterLineX;

        seaweed.forEach(s => drawSeaweed(s, time));
        fishes.forEach(f => drawFish(f, time));

        // [순서 변경 2] 미니맵(분석창)을 가장 마지막에 그려서 모든 요소의 위에 오게 합니다.
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = 15; ctx.shadowColor = 'black';
        ctx.beginPath();
        if(ctx.roundRect) {
            ctx.roundRect(mapInfo.x - 5, mapInfo.y - 5, mapInfo.w + 10, mapInfo.h + 10, 10);
        } else {
            ctx.fillRect(mapInfo.x - 5, mapInfo.y - 5, mapInfo.w + 10, mapInfo.h + 10);
        }
        ctx.fill(); ctx.shadowBlur = 0;

        ctx.fillStyle = '#C2B280';
        ctx.fillRect(mapInfo.x, mapInfo.y, mapInfo.w, mapInfo.h);

        if (discoveredHighX > discoveredLowX) {
            const mudStart = (discoveredLowX / width) * mapInfo.w;
            const mudEnd = (discoveredHighX / width) * mapInfo.w;
            ctx.fillStyle = '#5D4037'; 
            ctx.fillRect(mapInfo.x + mudStart, mapInfo.y, mudEnd - mudStart, mapInfo.h);
        }

        const seaDisplayW = ((waterLineX / width) * mapInfo.w);
        ctx.fillStyle = '#00a8ff';
        ctx.fillRect(mapInfo.x, mapInfo.y, seaDisplayW, mapInfo.h);
        
        ctx.fillStyle = 'white'; ctx.font = (mapInfo.isExpanded ? '18px' : '10px') + ' NexonMaplestory';
        ctx.fillText(mapInfo.isExpanded ? '상세 분석 모드 (클릭 시 축소)' : '평면 분석 (클릭)', mapInfo.x, mapInfo.y - 10);
        ctx.restore();

        requestAnimationFrame(draw);
    }



    draw();
</script>
</body>
</html>
